[package]
name = "decengine-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "decengine"
path = "src/main.rs"

[features]
default = ["fixture-engine"]
fixture-engine = [
    "decengine-engine/fixture-engine",
    "decengine-runtime/fixture-engine",
    "decengine-server/fixture-engine",
]
mlx = ["dep:decengine-engine-mlx"]

[dependencies]
anyhow.workspace = true
hex.workspace = true
clap.workspace = true
decengine-engine = { path = "../decengine-engine" }
decengine-engine-mlx = { path = "../decengine-engine-mlx", optional = true }
decengine-core = { path = "../decengine-core" }
decengine-compiler = { path = "../decengine-compiler" }
decengine-models = { path = "../decengine-models" }
decengine-runtime = { path = "../decengine-runtime" }
decengine-server = { path = "../decengine-server" }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tokenizers = "=0.22.1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
